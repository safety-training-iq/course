<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>مستحقي العلاوات - فرع كهرباء الصدر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<style>/* Layout: logo masthead, sticky filter bar, one column of employee cards (alphabetical or grouped) */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#14243a; --muted:#566579; --line:#d6dee8;
  --navy:#34679a; --navy-ink:#ffffff; --sky:#c6ddf5; --steel:#77a0c7; --bolt:#e1323a; --bolt-soft:#fde4e5;
  --ok:#1d7a4a; --ok-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fff0d6; --hit:#ffe9a8; --chip:#e9eff6;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --surface:#152132; --ink:#e5edf6; --muted:#9db0c5; --line:#2a3a50;
  --navy:#8db8e3; --navy-ink:#0c1828; --sky:#284567; --steel:#5f88b0; --bolt:#ff5a60; --bolt-soft:#3d1c20;
  --ok:#6fd39c; --ok-soft:#173527; --warn:#f2b85a; --warn-soft:#3a2a10; --hit:#5b4a12; --chip:#1e2d42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1622; --surface:#152132; --ink:#e5edf6; --muted:#9db0c5; --line:#2a3a50;
  --navy:#8db8e3; --navy-ink:#0c1828; --sky:#284567; --steel:#5f88b0; --bolt:#ff5a60; --bolt-soft:#3d1c20;
  --ok:#6fd39c; --ok-soft:#173527; --warn:#f2b85a; --warn-soft:#3a2a10; --hit:#5b4a12; --chip:#1e2d42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{padding-block:22px 6px;display:flex;gap:18px;align-items:center}
.mast img{width:84px;height:84px;flex:none}
.mast .txt{min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--navy);letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4.4vw,34px);margin:2px 0 4px;text-wrap:balance;line-height:1.3}
h1 .bolt{color:var(--bolt)}
.lede{color:var(--muted);margin:0;max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:14px 0 0;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-display);font-size:19px;color:var(--navy);margin-left:6px}
.stat span{color:var(--muted);font-size:13px}
.stat.due b{color:var(--bolt)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(20,36,58,.05);margin-top:16px}
.bar .wrap{padding-block:12px;display:grid;gap:10px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--navy)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters label{display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:0}
select,.fld input,.fld select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
select:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--ink)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.danger{color:var(--bolt);border-color:var(--bolt)}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--muted)}

.notice{margin-top:14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-inline-start:5px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.notice b{color:var(--warn)}
.editbar{background:var(--bolt-soft);border:1px solid var(--bolt);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:14px}
.editbar p{margin:0;font-size:13px}

main{padding-block:16px 48px}
.letter{font-family:var(--f-display);font-weight:800;color:var(--navy);font-size:18px;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--sky);display:flex;justify-content:space-between;align-items:baseline}
.letter small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
details.grp>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .n{background:var(--navy);color:var(--navy-ink);font-variant-numeric:tabular-nums;font-size:12px;padding:1px 9px;border-radius:999px}
details.grp>summary .kind{font-size:11px;color:var(--muted);font-weight:500;border:1px solid var(--line);padding:0 6px;border-radius:3px;margin-inline-start:6px}
details.grp>summary::before{content:"‹";color:var(--muted);transition:transform .15s;display:inline-block}
details.grp[open]>summary::before{transform:rotate(-90deg)}
details.grp>summary .lbl{flex:1;min-width:0}
.grp-tools{display:flex;justify-content:flex-end;padding:8px 14px;border-top:1px solid var(--line);background:var(--bg)}
.flat{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.emp{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.5fr) minmax(0,2.4fr) auto;gap:4px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.flat .emp:first-child,.list .emp:first-child{border-top:0}
.nm{font-weight:600;min-width:0}
.nm .id{display:block;font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.org{font-size:13px;min-width:0}
.org .sec{color:var(--muted);display:block}
.pay{font-size:12.5px;font-variant-numeric:tabular-nums;min-width:0;display:grid;gap:2px}
.pay .ln{display:flex;flex-wrap:wrap;gap:2px 10px}
.pay .k{color:var(--muted)}
.pay .arrow{color:var(--steel)}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--chip);white-space:nowrap}
.tag.g{background:var(--navy);color:var(--navy-ink)}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.pill.due{background:var(--bolt-soft);color:var(--bolt)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.later{background:var(--ok-soft);color:var(--ok)}
.note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.flag{grid-column:1/-1;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:3px 8px}
.edit-btn{font-size:12px;padding:2px 10px}
mark{background:var(--hit);color:inherit;border-radius:2px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:8px}
.more{display:block;margin:14px auto 0}
footer{color:var(--muted);font-size:12px;padding-block:0 32px;display:grid;gap:4px}

.overlay{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:20;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:10px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:18px;display:grid;gap:12px;border:1px solid var(--line)}
.dlg h2{font-family:var(--f-display);font-size:18px;margin:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fld{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.calc{font-size:13px;background:var(--bg);border-radius:6px;padding:8px 10px;font-variant-numeric:tabular-nums}
.dlg .actions{justify-content:space-between}

@media (max-width:760px){
  .bar{position:static}
  .emp{grid-template-columns:minmax(0,1fr) auto}
  .org,.pay,.nm{grid-column:1/-1}
  .tags{grid-column:1/-1;justify-content:flex-start}
  .mast img{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const coll = new Intl.Collator("ar");
const norm = s => String(s||"").replace(/[ً-ْـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g," ").trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
function parseDate(s){
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s).trim()); if(!m) return null;
  const d=new Date(+m[3],+m[2]-1,+m[1]); return d.getDate()===+m[1]&&d.getMonth()===+m[2]-1?d:null;
}
DATA.forEach(d=>{
  d._n=norm(d.name); d._k=d._n.replace(/ /g,"");
  const dt=parseDate(d.next);
  d.status=!dt?"bad":dt<=TODAY?"due":(dt-TODAY)/864e5<=30?"soon":"later";
});
DATA.sort((a,b)=>coll.compare(a.name,b.name));
const STATUS={due:"مستحقة",soon:"خلال 30 يوماً",later:"قادمة",bad:"يُراجَع التاريخ"};
const state={view:"alpha",limit:150};

function countBy(k){const c={};DATA.forEach(d=>c[d[k]]=(c[d[k]]||0)+1);return c;}
function opts(sel,label,values,counts){sel.innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)} (${counts[v]||0})</option>`).join("");}
const cG=countBy("grade"),cC=countBy("cert"),cT=countBy("title"),cS=countBy("status");
opts($("fGrade"),"كل الدرجات",GRADES.filter(g=>cG[g]),cG);
opts($("fCert"),"كل الشهادات",[...CERTS.filter(c=>cC[c]),...Object.keys(cC).filter(c=>!CERTS.includes(c))],cC);
opts($("fTitle"),"كل العناوين",Object.keys(cT).filter(Boolean).sort(coll.compare),cT);
const cB={}; DATA.forEach(d=>batchesOf(d).forEach(b=>cB[b]=(cB[b]||0)+1));

  .map(([n,l])=>`<div class="stat"><b>${n.toLocaleString("ar")}</b><span>${l}</span></div>`).join("");

function filtered(){
  const q=norm($("q").value),terms=q.split(" ").filter(Boolean),qk=q.replace(/ /g,"");
  const g=$("fGrade").value,c=$("fCert").value,t=$("fTitle").value,s=$("fStatus").value,bt=$("fBatch").value;
  return {q,rows:DATA.filter(d=>(!g||d.grade===g)&&(!c||d.cert===c)&&(!t||d.title===t)&&(!s||d.status===s)&&(!bt||batchesOf(d).includes(bt))&&
    (!terms.length||terms.every(x=>d._n.includes(x))||d._k.includes(qk)))};
}
function hl(name,q){
  if(!q) return esc(name);
  const chars=[...name];let joined="",map=[];
  chars.forEach((c,i)=>{for(const ch of norm(c)){joined+=ch;map.push(i);}});
  const mark=new Array(chars.length).fill(false);
  q.split(" ").filter(Boolean).forEach(t=>{let i=joined.indexOf(t);while(i>-1){for(let j=i;j<i+t.length;j++)mark[map[j]]=true;i=joined.indexOf(t,i+t.length);}});
  let out="",open=false;
  chars.forEach((c,i)=>{if(mark[i]&&!open){out+="<mark>";open=true}if(!mark[i]&&open){out+="</mark>";open=false}out+=esc(c);});
  return out+(open?"</mark>":"");
}
function rowHTML(d,q){
  return `<div class="emp">
    <div class="nm">${hl(d.name,q)}<span class="id">${esc(d.batch||"")}</span></div>
    <div class="org">${esc(d.title||"—")}</div>
    <div class="pay"><div class="ln"><span><span class="k">المرحلة</span> ${esc(d.stage)} <span class="arrow">←</span> ${esc(d.due)}</span><span><span class="k">العلاوة</span> ${esc(d.next||"—")}</span></div></div>
    <div class="tags"><span class="tag g">${esc(d.grade)}</span><span class="tag">${esc(d.cert)}</span><span class="pill ${d.status==="bad"?"soon":d.status}">${STATUS[d.status]}</span></div>
  </div>`;
}
const firstLetter=d=>d._n[0]||"#";
function render(){
  const {q,rows}=filtered(),out=$("out");
  $("count").innerHTML=`يظهر <b>${rows.length.toLocaleString("ar")}</b> من ${DATA.length.toLocaleString("ar")}`;
  if(!rows.length){out.innerHTML=`<div class="empty">لا يوجد اسم يطابق هذا البحث. جرّب كتابة الاسم الأول فقط، أو اضغط «مسح الفلاتر».</div>`;return;}
  if(state.view==="alpha"){
    const shown=rows.slice(0,state.limit),per={};rows.forEach(r=>{const L=firstLetter(r);per[L]=(per[L]||0)+1;});
    let html="",cur=null,buf="";
    const flush=()=>{if(cur!==null)html+=`<div class="letter">${esc(cur)}<small>${per[cur]}</small></div><div class="flat">${buf}</div>`;};
    shown.forEach(d=>{const L=firstLetter(d);if(L!==cur){flush();cur=L;buf="";}buf+=rowHTML(d,q);});
    flush();
    if(rows.length>shown.length) html+=`<button class="btn more" id="more">عرض المزيد (${(rows.length-shown.length).toLocaleString("ar")} متبقٍ)</button>`;
    out.innerHTML=html;
    const m=$("more");if(m)m.onclick=()=>{state.limit+=300;render();};
  }else{
    const key=state.view==="grade"?"grade":state.view==="batch"?"batch":"cert",order=key==="grade"?GRADES:key==="batch"?BATCHES:CERTS;
    const groups={};rows.forEach(d=>(key==="batch"?batchesOf(d).filter(v=>!$("fBatch").value||v===$("fBatch").value):[d[key]]).forEach(v=>(groups[v]=groups[v]||[]).push(d)));
    const names=Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    const openAll=names.length===1||!!q;
    out.innerHTML=names.map((n,i)=>`<details class="grp"${openAll?" open":""} data-i="${i}"><summary><span class="lbl">${key==="grade"?"الدرجة ":""}${esc(n||"غير محدد")}</span><span class="n">${groups[n].length}</span></summary><div class="list"></div></details>`).join("");
    out.querySelectorAll("details.grp").forEach(det=>{
      const g=groups[names[+det.dataset.i]];
      const fill=()=>{const box=det.querySelector(".list");if(!box.dataset.done){box.innerHTML=g.map(d=>rowHTML(d,q)).join("");box.dataset.done=1;}};
      if(det.open)fill();det.addEventListener("toggle",()=>det.open&&fill());
    });
  }
}
let tm;$("q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{state.limit=150;render();},120);});
["fGrade","fCert","fTitle","fStatus","fBatch"].forEach(id=>$(id).addEventListener("change",()=>{state.limit=150;render();}));
const views={vAlpha:"alpha",vGrade:"grade",vCert:"cert",vBatch:"batch"};
Object.keys(views).forEach(id=>$(id).addEventListener("click",()=>{state.view=views[id];Object.keys(views).forEach(b=>$(b).setAttribute("aria-pressed",b===id));render();}));
$("reset").onclick=()=>{$("q").value="";["fGrade","fCert","fTitle","fStatus","fBatch"].forEach(id=>$(id).value="");state.limit=150;render();};
render();
</script>
</body>
</html>
