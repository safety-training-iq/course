<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار السلامة المهنية للإداريين</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1b2a3a;--mut:#5d6b7a;--line:#d3dbe4;--acc:#f2b705;--ok:#1f8a4c;--okbg:#e2f4ea;--bad:#c0392b;--badbg:#fbe6e3;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b26;--card:#1b2735;--ink:#e8eef5;--mut:#9fb0c1;--line:#2e3d4e;--okbg:#17372a;--badbg:#412020;--ok:#4fc983;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#121b26;--card:#1b2735;--ink:#e8eef5;--mut:#9fb0c1;--line:#2e3d4e;--okbg:#17372a;--badbg:#412020;--ok:#4fc983;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,'Segoe UI',Arial,sans-serif;line-height:1.7;font-size:17px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.q{font-size:19px;font-weight:700;margin:0 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;padding:12px 14px;margin:0 0 8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.opt:focus-visible,.go:focus-visible,.tabs button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.sel{border-color:var(--acc);background:rgba(242,183,5,.2)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.go{font:inherit;font-weight:700;margin-top:14px;padding:11px 22px;border:0;border-radius:10px;background:var(--acc);color:#1b2a3a;cursor:pointer}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--acc);text-align:center}
.score{font-size:40px;font-weight:800;margin:0}
.rev{margin:10px 0;padding:10px 12px;border-right:4px solid var(--bad);background:var(--badbg);border-radius:8px;font-size:15px}
.rev b{color:var(--ok)}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1b2a3a"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="السلامة المهنية"><style>.nv{display:flex;gap:6px;max-width:640px;margin:0 auto;padding:10px 16px 0}.nv a{flex:1;text-align:center;text-decoration:none;font-size:14px;padding:8px;border-radius:10px;border:1.5px solid #8885;color:inherit}.nv a.on{background:#1b2a3a;color:#fff;border-color:#1b2a3a}</style><style>.ins{display:block;overflow:hidden;max-width:640px;margin:0 auto;padding:12px 16px 0}.ins img{display:block;width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid #f2b705;background:#ccc}.ins td{color:inherit}.ins b{display:block;font-size:18px;line-height:1.5}.ins span{display:block;font-size:12.5px;opacity:.75;line-height:1.5}</style></head>

E('عدّد أسباب آلام العمود الفقري (اختر 6):',['الوقفات غير الصحيحة','القوة المتورطة (الشد فوق مستوى الرأس)','العادات السيئة (ضعف عضلات الظهر وترهل البطن)','الجلسات غير الصحية','الوزن الزائد','الإجهاد والتوتر'],['شرب الماء','النوم الكافي']),
E('وظائف العمود الفقري (اختر 2):',['مساعدتك على الجلوس والقعود والمشي','حماية الحبل الشوكي'],['هضم الطعام','تنقية الدم']),
E('الأمور التي تحد من حرائق الحاسب الآلي (اختر 5):',['اختيار الموقع','الإنشاءات','أجهزة كشف الحريق','أجهزة إخماد الحريق','الترتيب والنظافة'],['زيادة عدد الموظفين']),
E('مميزات غاز ثاني أوكسيد الكاربون في الإطفاء (اختر 5):',['أثقل من الهواء بمرة ونصف','لا يشتعل ولا يساعد على الاشتعال','لا يترك أثرًا بعد الإطفاء','عديم اللون والطعم والرائحة','يذوب في الماء مكونًا حامض الكربونيك'],['له رائحة نفاذة','أخف من الهواء']),
E('اشتراطات السلامة بمكان العمل (اختر 5):',['سلامة الأرضيات','التوصيلات الكهربائية','مخارج النجاة','وسائل الإنذار ومكافحة الحريق','معدات الإسعافات الأولية'],['عدد النوافذ']),
E('عدّد المواد القابلة للاشتعال اللازمة للحاسبات (اختر 4):',['الورق','البطاقات','المواد البلاستيكية المختلفة','الميكروفيلم'],['الزجاج','الحديد']),
E('نصائح لسلامة العين أمام الشاشة (اختر 5):',['إعطاء العينين راحة بالنظر بعيدًا','التغميض المتكرر لترطيب العين','إبعاد الشاشة 40 – 60 سم','جعل أعلى الشاشة بمستوى العينين','تنظيف الشاشة من الغبار'],['رفع سطوع الشاشة للأقصى','إطفاء إضاءة الغرفة']),
E('مفردات الدورة (اختر 5):',['مقدمة عن السلامة الصناعية','السلامة في الأعمال المكتبية','السلامة عند استخدام الحاسوب','سلامة العمود الفقري','السيطرة على الحرائق في المكاتب والحاسوب'],['الإسعافات الجراحية'])
);
const NAMES={all:'الكل',m:'اختيار من متعدد',t:'صح وخطأ',f:'ملء الفراغ',e:'تعداد'};
const LBL={m:'اختيار من متعدد',t:'صح أم خطأ؟',f:'أكمل الفراغ',e:'تعداد: اختر كل الإجابات الصحيحة'};
let sel=new Set(),list=[],i=0,score=0,wrong=[],done=false,mode='all';
const $=id=>document.getElementById(id);
function tabs(){ $('tabs').innerHTML=Object.keys(NAMES).map(k=>`<button class="${k===mode?'on':''}" onclick="start('${k}')">${NAMES[k]}</button>`).join('');}
// خلط الخيارات في كل مرة حتى لا يثبت موقع الجواب الصحيح (ما عدا صح وخطأ)
const sh=q=>{if(q[0]==='t')return q;const c=q[0]==='e'?q[3]:[q[3]];const a=q[2].map((o,k)=>[o,c.includes(k)]).sort(()=>Math.random()-.5);const idx=a.map((x,k)=>x[1]?k:-1).filter(k=>k>=0);return [q[0],q[1],a.map(x=>x[0]),q[0]==='e'?idx:idx[0]];};
function start(k,custom){ mode=k||mode; list=(custom||Q.filter(q=>mode==='all'||q[0]===mode)).map(sh); i=0;score=0;wrong=[];done=false;tabs();show();}
function show(){
  if(i>=list.length) return end();
  const q=list[i];sel=new Set();
  const text=q[0]==='f'?q[1].replace('____','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>'):q[1];
  $('app').innerHTML=`<div class="bar"><i style="width:${i/list.length*100}%"></i></div>
  <div class="meta"><span>${LBL[q[0]]}</span><span>${i+1} / ${list.length}</span></div>
  <div class="card"><p class="q">${text}</p>${q[2].map((o,k)=>`<button class="opt" onclick="${q[0]==='e'?'tog('+k+',this)':'pick('+k+')'}">${o}</button>`).join('')}<div id="fb">${q[0]==='e'?'<button class="go" onclick="check()">تأكيد الإجابة</button>':''}</div></div>`;
}
const ans=q=>q[0]==='e'?q[3].map(c=>q[2][c]).join('، '):q[2][q[3]];
function tog(k,b){sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('sel');}
function check(){
  const q=list[i],c=q[3],ok=sel.size===c.length&&c.every(x=>sel.has(x));
  document.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;x.classList.remove('sel');if(c.includes(n))x.classList.add('ok');else if(sel.has(n))x.classList.add('bad');});
  if(ok)score++;else wrong.push(q);
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'إجابة صحيحة ✓':'إجابة ناقصة أو خاطئة. الصحيح: '+ans(q)}</div><button class="go" onclick="i++;show()">${i+1<list.length?'السؤال التالي':'عرض النتيجة'}</button>`;
  $('fb').querySelector('.go').focus();
}
function pick(k){
  const q=list[i],ok=k===q[3],b=document.querySelectorAll('.opt');
  b.forEach((x,n)=>{x.disabled=true;if(n===q[3])x.classList.add('ok');});
  if(!ok){b[k].classList.add('bad');wrong.push(q);}else score++;
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'إجابة صحيحة ✓':'إجابة خاطئة. الصحيح: '+ans(q)}</div><button class="go" onclick="i++;show()">${i+1<list.length?'السؤال التالي':'عرض النتيجة'}</button>`;
  $('fb').querySelector('.go').focus();
}
function end(){
  const n=list.length;
  $('app').innerHTML=`<div class="card"><p class="score">${score} / ${n}</p>
  <p>${wrong.length?'راجع الأسئلة التي أخطأت بها:':'ممتاز، كل الإجابات صحيحة.'}</p>
  ${wrong.map(q=>`<div class="rev">${q[1]}<br><b>الجواب: ${ans(q)}</b></div>`).join('')}
  ${wrong.length?'<button class="go" onclick="start(mode,wrong.slice())">أعد الأخطاء فقط</button> ':''}
  <button class="go" onclick="start(mode)">أعد الاختبار</button></div>`;
}
start('all');
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body>
